<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>KotaMusic | Audio Engineer</title>

  <!-- ICONOS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- FUENTE -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
  .style-icon {
    display: inline-block;
    padding: 15px;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.3s, border-color 0.3s;
    border: 2px solid transparent;
  }

  .style-icon:hover {
    border-color: #a855f7;
    transform: translateY(-3px) scale(1.15);
  }

  .style-icon.active {
    transform: scale(1.2);
    border-color: #a855f7;
  }

  /* VOLUMEN GLOBAL */
  .global-volume {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 9999;
  }

  #volumeControl {
    writing-mode: bt-lr;
    -webkit-appearance: slider-vertical;
    width: 8px;
    height: 150px;
    cursor: pointer;
  }
  </style>
</head>

<body>

<!-- VOLUMEN -->
<div class="global-volume">
  <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="1">
</div>

<!-- HERO -->
<section class="hero">
  <h1>KotaMusic</h1>
  <p class="subtitle">Audio Engineer • Composer</p>
  <p class="tagline">Creating the sound you are looking for</p>
  <div class="socials">
    <a href="https://www.youtube.com/@kotamusic1" target="_blank"><i class="fab fa-youtube"></i></a>
    <a href="https://soundcloud.com/user-876843643" target="_blank"><i class="fab fa-soundcloud"></i></a>
    <a href="https://www.instagram.com/kotamusic1/" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://x.com/Kotamusic1" target="_blank"><i class="fab fa-x-twitter"></i></a>
  </div>
</section>

<!-- VG -->
<section class="section vg-section">
  <h2>Videogame Music</h2>

  <div class="vg-container">
    <div class="vg-image" onclick="swapImages()">
      <img id="img1" src="images/Chilly Fox.png" class="active">
      <img id="img2" src="images/MMXII.png">
    </div>

    <div class="vg-audio">
      <audio controls src="Audio/MMXII1.mp3"></audio>
      <audio controls src="Audio/MMXII2.mp3"></audio>
      <audio controls src="Audio/MMXII3.mp3"></audio>
    </div>

    <div class="vg-text">
      <p>
        Videogame focused compositions, combining narrative context and immersion.
      </p>
    </div>
  </div>
</section>

<div class="section-combo"></div>

<!-- PICK YOUR MOOD -->
<section class="styles-section">
  <h2>Pick Your Mood</h2>

  <p class="styles-description">
    As we already know, context is everything!
  </p>

  <div class="styles-icons">
    <div class="style-icon" data-audio="Audio/miedo.mp3">
      <i class="fas fa-ghost"></i><p>Scary</p>
    </div>
    <div class="style-icon" data-audio="Audio/calma.mp3">
      <i class="fas fa-water"></i><p>Soothing</p>
    </div>
    <div class="style-icon" data-audio="Audio/alegria.mp3">
      <i class="fas fa-music"></i><p>Joyful</p>
    </div>
  </div>
</section>

<div class="section-combo"></div>

<!-- VARIETY -->
<section class="section variety-section">
  <h2>Variety</h2>

  <div class="variety-player">
    <div class="song-list">

      <div class="song-item">
        <i class="fas fa-play-circle"></i>
        <audio src="Audio/Pokemon.mp3"></audio>
      </div>

      <div class="song-item">
        <i class="fas fa-play-circle"></i>
        <audio src="Audio/Mario.mp3"></audio>
      </div>

    </div>
  </div>
</section>

<!-- BOTON -->
<button id="back-to-top">
  <i class="fas fa-step-backward"></i>
</button>

<script>
const volumeControl = document.getElementById("volumeControl");
let currentAudio = null;

/* VOLUMEN GLOBAL TIEMPO REAL */
function applyVolume(audio) {
  audio.volume = volumeControl.value;
}

volumeControl.addEventListener("input", () => {
  if (currentAudio) currentAudio.volume = volumeControl.value;
});

/* VG */
document.querySelectorAll(".vg-audio audio").forEach(audio => {
  audio.addEventListener("play", () => {
    if (currentAudio && currentAudio !== audio) currentAudio.pause();
    currentAudio = audio;
    applyVolume(audio);
  });
});

/* PICK YOUR MOOD */
document.querySelectorAll(".style-icon").forEach(icon => {
  const audio = new Audio(icon.dataset.audio);
  audio.loop = true;

  icon.addEventListener("click", () => {

    if (currentAudio && currentAudio !== audio) {
      currentAudio.pause();
    }

    if (audio.paused) {
      audio.play();
      document.querySelectorAll(".style-icon").forEach(i => i.classList.remove("active"));
      icon.classList.add("active");
    } else {
      audio.pause();
      icon.classList.remove("active");
    }

    currentAudio = audio;
    applyVolume(audio);
  });
});

/* VARIETY */
document.querySelectorAll(".song-item").forEach(item => {
  const audio = item.querySelector("audio");
  const icon = item.querySelector("i");

  item.addEventListener("click", () => {

    document.querySelectorAll(".style-icon").forEach(i => i.classList.remove("active"));

    if (currentAudio && currentAudio !== audio) {
      currentAudio.pause();
      document.querySelectorAll(".song-item i").forEach(i => i.className = "fas fa-play-circle");
    }

    if (audio.paused) {
      audio.play();
      icon.className = "fas fa-pause-circle";
    } else {
      audio.pause();
      icon.className = "fas fa-play-circle";
    }

    currentAudio = audio;
    applyVolume(audio);
  });
});
</script>

</body>
</html>
